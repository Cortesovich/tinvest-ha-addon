name: build

# Собирает образ бота для aarch64 и amd64 и публикует на ghcr.io.
# Запускается при каждом коммите в main и вручную (кнопка Run workflow).
on:
  push:
    branches: [ main ]
    paths:
      - "build/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-python:3.13-alpine3.23
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Owner в нижнем регистре (для имени образа ghcr)
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: QEMU (эмуляция arm64 на amd64-раннере)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./build/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/tinvest-bot-${{ matrix.arch }}:1.1.7
            ghcr.io/${{ steps.vars.outputs.owner }}/tinvest-bot-${{ matrix.arch }}:latest
