name: build-scoring

# Builds the SEPARATE scoring add-on image (tinvest-scoring) for aarch64/amd64
# and publishes to ghcr.io. Independent of the trading build.yml:
# that one triggers on build/**, this one only on build_scoring/**.
on:
  push:
    branches: [ main ]
    paths:
      - "build_scoring/**"
      - ".github/workflows/build-scoring.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-python:3.13-alpine3.23
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner (ghcr image name)
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: QEMU (emulate arm64 on amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./build_scoring
          file: ./build_scoring/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/tinvest-scoring-${{ matrix.arch }}:0.3.2
            ghcr.io/${{ steps.vars.outputs.owner }}/tinvest-scoring-${{ matrix.arch }}:latest