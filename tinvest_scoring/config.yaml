name: TInvest Скоринг (акции)
version: "0.3.1"
slug: tinvest_scoring
description: >-
  Отдельный read-only процесс: считает рыночный профиль акций ИИС по публичным
  данным MOEX ISS (пакет tinvest_scoring от Codex) и публикует снимок в витрину.
  НЕ торгует, токена Т-Банка не имеет, /share читает только для чтения.

# Готовый образ с ghcr.io (собирает GitHub Actions: build-scoring.yml).
# Отдельный образ от торгового бота — торговый аддон не затрагивается.
image: "ghcr.io/cortesovich/tinvest-scoring-{arch}"

arch:
  - aarch64
  - amd64

# Базовый образ содержит s6-overlay — свой init не навязываем.
init: false
startup: application
# ВАЖНО: на первом этапе автозапуск ВЫКЛ. Роман включит boot: auto (или запустит
# вручную) после сухого прогона и приёмки. До этого — только ручной старт.
boot: manual

# /share ТОЛЬКО ДЛЯ ЧТЕНИЯ: аддон читает выгрузки бота (universe/allowlist,
# и при наличии — quality_snapshot), но НИЧЕГО в /share не пишет. Своё рабочее
# состояние держит в /data (постоянный диск аддона, переживает перезапуск).
map:
  - share:ro

# Изоляция (умолчания HA и так это дают, фиксируем явно намерением):
# без портов, без host_network, без privileged, без доступа к Docker/Supervisor/
# Home Assistant API, без токена Т-Банка и без конфигурации торгового аддона.

options:
  publish_enabled: false
  run_on_start: false
  scoring_ingest_url: "https://investor-terminal-iis.cortes301992.workers.dev/scoring-ingest"
  scoring_service_secret: ""
  schedule_time: "07:00"
  timezone: "Europe/Moscow"
  workers: 2
  input_max_age_hours: 36
  use_quality_snapshot: true
  attempt_timeout_minutes: 30
  retry_times:
    - "07:30"
    - "08:00"
  log_level: "info"

schema:
  publish_enabled: bool
  run_on_start: bool
  scoring_ingest_url: url
  # Секрет вводится в защищённой настройке аддона (тип password). В коде, логах
  # и этом файле его нет; дочернему расчётному процессу он не передаётся.
  scoring_service_secret: password
  schedule_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  timezone: str
  workers: int(1,4)
  input_max_age_hours: int(1,168)
  use_quality_snapshot: bool
  attempt_timeout_minutes: int(5,120)
  retry_times:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  log_level: list(debug|info|warning|error)
