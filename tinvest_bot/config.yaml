name: TInvest ИИС Bot
version: "1.1.1"
slug: tinvest_bot
description: >-
  Telegram-бот для ИИС в Т-Инвестициях: баланс, доходность (XIRR), купоны,
  сроки погашения, подбор и покупка надёжных облигаций и акций.

# Логин уже вписан (cortesovich, нижний регистр — так требует ghcr.io).
# Дополнение НЕ собирается на сервере, а скачивает готовый образ с ghcr.io
# (его собирает GitHub Actions). {arch} HA подставит сам (aarch64/amd64).
image: "ghcr.io/cortesovich/tinvest-bot-{arch}"

arch:
  - aarch64
  - amd64
# Базовый образ уже содержит s6-overlay — свой init не навязываем.
init: false
startup: application
# Автозапуск при загрузке сервера (24/7). Watchdog включается в интерфейсе.
boot: auto
# Доступ к /share — там папка tinvest с .env, config.yaml, csv, логами.
map:
  - share:rw
